<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>탁상시계</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; background: var(--bg, #000); color: #fff; }
  body {
    font-family: -apple-system, "Roboto", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    user-select: none; overflow: hidden;
  }
  /* 시계는 화면 위쪽 1/5 지점부터 시작 (아래쪽은 미디어 + 날씨 자리) */
  .clock {
    flex: 1; display: flex; flex-direction: column;
    justify-content: flex-start; align-items: center; text-align: center;
    padding-top: 17vh;
  }
  .date { font-size: 7vw; color: #ccc; letter-spacing: .02em; }
  .time {
    font-size: 27vw; font-weight: 200; line-height: 1;
    font-variant-numeric: tabular-nums; margin-top: 2vh;
  }
  .sec { font-size: 9vw; color: #888; font-variant-numeric: tabular-nums; margin-top: 1vh; }
  .ampm { font-size: 6vw; color: #aaa; margin-top: 1vh; }

  /* 날씨: 화면 아래에 작게 고정, 시계가 화면 정중앙에 오도록 흐름에서 뺌 */
  .weather {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 4vh);
    padding: 0 20px;
  }
  .loc { font-size: 3.6vw; color: #666; text-align: center; margin-bottom: 1.6vh; }
  .rows { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2vw; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: .6vh; }
  .cell .h { font-size: 3.6vw; color: #888; }
  .cell .ic { font-size: 7vw; line-height: 1.2; }
  .cell .t { font-size: 5vw; font-variant-numeric: tabular-nums; }
  .cell .p { font-size: 3.4vw; color: #6cb6ff; font-variant-numeric: tabular-nums; }
  .cell.now .h { color: #fff; font-weight: 600; }
  .msg { grid-column: 1 / -1; text-align: center; color: #666; font-size: 3.6vw; }

  /* 앱(APK)에서만: 위쪽 알림 아이콘 + 배터리 */
  .status {
    position: fixed; left: 0; right: 0;
    top: calc(env(safe-area-inset-top) + 14px);
    padding: 0 20px; display: flex; justify-content: space-between; align-items: center;
    color: #aaa; font-size: 3.8vw; z-index: 5;
  }
  .notifs { display: flex; gap: 2.2vw; align-items: center; min-height: 5vw; }
  .notifs img { width: 4.6vw; height: 4.6vw; opacity: .85; }
  .right { display: flex; align-items: center; gap: 4vw; }
  .gear {
    background: none; border: 0; color: #777; padding: 1vw; display: flex;
  }
  .gear svg { width: 5.4vw; height: 5.4vw; fill: currentColor; }
  .nhint {
    background: none; border: 1px solid #333; border-radius: 999px; color: #888;
    font-size: 3.2vw; padding: .6vh 3vw; font-family: inherit;
  }
  .batt { display: flex; align-items: center; gap: 1.6vw; font-variant-numeric: tabular-nums; }
  .batt .shell { width: 7vw; height: 3.6vw; border: 1.5px solid #aaa; border-radius: 3px; padding: 1.5px; position: relative; }
  .batt .shell::after { content: ""; position: absolute; right: -4px; top: 30%; width: 2px; height: 40%; background: #aaa; border-radius: 1px; }
  .batt .fill { height: 100%; background: #ddd; border-radius: 1px; }
  .batt.low .fill { background: #ff6b6b; }
  .batt.charging .fill { background: #5fd38d; }

  /* 현재 재생 중인 미디어 (앱에서만) */
  .media {
    display: flex; align-items: center; gap: 3.6vw;
    background: rgba(255,255,255,.06); border-radius: 14px;
    padding: 2.6vw; margin-bottom: 4vh;
  }
  .media img { width: 14vw; height: 14vw; border-radius: 8px; object-fit: cover; background: #222; flex: none; }
  .media img[src=""] { visibility: hidden; }
  .mtext { flex: 1; min-width: 0; }
  .mt { font-size: 4.2vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ma { font-size: 3.4vw; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .4vh; }
  .mctl { display: flex; gap: 1vw; flex: none; }
  .mctl button { background: none; border: 0; color: #ddd; padding: 1.6vw; display: flex; }
  .mctl svg { width: 6.4vw; height: 6.4vw; fill: currentColor; }
  .mctl #mPlay svg { width: 7.6vw; height: 7.6vw; }

  /* 밝은 배경을 고르면 글씨를 어두운 색으로 */
  body.light { color: #111; }
  body.light .date { color: #444; }
  body.light .sec { color: #777; }
  body.light .loc, body.light .msg { color: #777; }
  body.light .cell .h { color: #777; }
  body.light .cell.now .h { color: #111; }
  body.light .cell .p { color: #1a6fd1; }
  body.light .status { color: #555; }
  body.light .gear { color: #666; }
  body.light .nhint { border-color: #bbb; color: #555; }
  body.light .notifs img { filter: invert(1); }
  body.light .batt .shell { border-color: #555; }
  body.light .batt .shell::after { background: #555; }
  body.light .batt .fill { background: #444; }
  body.light .batt.low .fill { background: #e03131; }
  body.light .batt.charging .fill { background: #2f9e44; }
  body.light .media { background: rgba(0,0,0,.06); }
  body.light .media img { background: #ddd; }
  body.light .ma { color: #666; }
  body.light .mctl button { color: #222; }

  /* 야간 모드: 전체를 어둡게 */
  body.night .clock, body.night .weather, body.night .status { opacity: .35; }

  .swatches { display: flex; flex-wrap: wrap; gap: 2.4vw; justify-content: flex-end; }
  .opt > div:first-child { flex: none; white-space: nowrap; }
  .opt > div:first-child small { white-space: normal; }
  .sw { width: 8vw; height: 8vw; border-radius: 50%; border: 2px solid #444; padding: 0 !important; }
  .sw.sel { border-color: #fff; box-shadow: 0 0 0 2px #000 inset; }
  .sw-custom { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red) !important; }
  .sw-custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }

  /* 설정 (오른쪽 위 톱니바퀴 또는 시계 길게 누르기) */
  .panel {
    position: fixed; inset: 0; background: rgba(0,0,0,.95);
    display: flex; flex-direction: column; gap: 3vh; overflow-y: auto;
    padding: calc(env(safe-area-inset-top) + 8vh) 8vw 6vh; font-size: 4.4vw; z-index: 10;
    color: #fff;
  }
  .panel h2 { font-size: 6vw; font-weight: 500; margin-bottom: 1vh; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 4vw; border-bottom: 1px solid #222; padding-bottom: 2.4vh; }
  .opt small { display: block; color: #777; font-size: 3.4vw; margin-top: .6vh; }
  .panel button, .panel select {
    background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 8px;
    font-size: 4vw; padding: 1.4vh 3.4vw; font-family: inherit;
  }
  .panel button.on { background: #fff; color: #000; border-color: #fff; }
  .panel .close { align-self: center; margin-top: 2vh; padding: 1.4vh 10vw; }
  .hint { color: #555; font-size: 3.2vw; text-align: center; }

  /* 가로 모드: 왼쪽 시계, 오른쪽 미디어 + 날씨. 글자 크기는 화면 높이(vh) 기준 */
  @media (orientation: landscape) {
    .clock { width: 56%; padding-top: 0; justify-content: center; }
    .date { font-size: 6vh; }
    .time { font-size: 34vh; margin-top: 2vh; }
    .sec { font-size: 8vh; }

    .weather {
      left: 56%; right: 0; top: 0; bottom: 0;
      display: flex; flex-direction: column; justify-content: center;
      padding: 10vh 4vw 4vh 2vw;
    }
    .media { gap: 3vh; padding: 2vh; margin-bottom: 6vh; }
    .media img { width: 14vh; height: 14vh; }
    .mt { font-size: 4.6vh; }
    .ma { font-size: 3.6vh; }
    .mctl button { padding: 1.6vh; }
    .mctl svg { width: 6.4vh; height: 6.4vh; }
    .mctl #mPlay svg { width: 7.6vh; height: 7.6vh; }
    .loc { font-size: 3.8vh; margin-bottom: 2.4vh; }
    .rows { gap: 1vw; }
    .cell { gap: 1vh; }
    .cell .h { font-size: 3.8vh; }
    .cell .ic { font-size: 8vh; }
    .cell .t { font-size: 5.4vh; }
    .cell .p { font-size: 3.6vh; }
    .msg { font-size: 3.6vh; }

    .status { font-size: 3.8vh; }
    .notifs { gap: 2.2vh; min-height: 5vh; }
    .notifs img { width: 4.6vh; height: 4.6vh; }
    .right { gap: 4vh; }
    .gear svg { width: 5.4vh; height: 5.4vh; }
    .nhint { font-size: 3.2vh; padding: .6vh 3vh; }
    .batt { gap: 1.6vh; }
    .batt .shell { width: 7vh; height: 3.6vh; }

    .panel { font-size: 4.4vh; padding: 8vh 18vw 6vh; gap: 3vh; }
    .panel h2 { font-size: 6vh; }
    .opt small { font-size: 3.4vh; }
    .panel button, .panel select { font-size: 4vh; padding: 1.4vh 3.4vh; }
    .sw { width: 8vh; height: 8vh; }
    .swatches { gap: 2.4vh; }
    .hint { font-size: 3.2vh; }
  }
</style>
</head>
<body>
  <div class="status" id="status">
    <div class="notifs" id="notifs"></div>
    <div class="right">
      <button class="gear" id="gearBtn" aria-label="설정"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1L11 21h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
      <div class="batt" id="batt" hidden><span id="battPct"></span><div class="shell"><div class="fill" id="battFill"></div></div></div>
    </div>
  </div>

  <section class="clock" id="clock">
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
    <div class="sec" id="sec"></div>
  </section>

  <section class="weather">
    <div class="media" id="media" hidden>
      <img id="mArt" src="" alt="">
      <div class="mtext"><div class="mt" id="mTitle"></div><div class="ma" id="mArtist"></div></div>
      <div class="mctl">
        <button id="mPrev" aria-label="이전 곡"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="mPlay" aria-label="재생 또는 일시정지"><svg viewBox="0 0 24 24"><path id="mPlayPath" d="M7 4v16l13-8z"/></svg></button>
        <button id="mNext" aria-label="다음 곡"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      </div>
    </div>
    <div class="loc" id="loc">위치 확인 중…</div>
    <div class="rows" id="rows"><div class="msg">날씨 불러오는 중…</div></div>
  </section>

  <div class="panel" id="panel" hidden>
    <h2>설정</h2>
    <div class="opt">
      <div>배경 색상</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="opt">
      <div>야간 모드<small>정해진 시간에 화면을 어둡게</small></div>
      <button id="nightBtn"></button>
    </div>
    <div class="opt">
      <div>야간 시간</div>
      <div><select id="nightFrom"></select> ~ <select id="nightTo"></select></div>
    </div>
    <div class="opt app-only">
      <div>알림 아이콘 · 재생 중인 미디어<small>알림 접근 권한이 필요해요</small></div>
      <button id="notifBtn"></button>
    </div>
    <div class="opt app-only">
      <div>미디어 표시 끄기<small>재생이 멈춘 뒤 이 시간이 지나면 숨겨요</small></div>
      <select id="mediaHide">
        <option value="30">30초</option>
        <option value="60">1분</option>
        <option value="90">1분 30초</option>
        <option value="120">2분</option>
      </select>
    </div>
    <div class="opt app-only">
      <div>충전 시 자동 실행<small>알림 접근 + 다른 앱 위에 표시 권한 필요</small></div>
      <button id="autoBtn"></button>
    </div>
    <button class="close" id="closeBtn">닫기</button>
    <div class="hint">오른쪽 위 톱니바퀴나 시계를 길게 눌러도 열려요</div>
  </div>

<script>
const $ = id => document.getElementById(id);
const DAYS = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2, '0');

/* ---------- 시계 ---------- */
function tick() {
  const d = new Date();
  $('date').textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`;
  $('time').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $('sec').textContent = pad(d.getSeconds());
}
tick();
setInterval(tick, 1000);

/* ---------- 날씨 ---------- */
const WMO = {
  0:['☀️','맑음'], 1:['🌤️','대체로 맑음'], 2:['⛅','구름 조금'], 3:['☁️','흐림'],
  45:['🌫️','안개'], 48:['🌫️','안개'],
  51:['🌦️','약한 이슬비'], 53:['🌦️','이슬비'], 55:['🌧️','강한 이슬비'],
  56:['🌧️','어는 이슬비'], 57:['🌧️','어는 이슬비'],
  61:['🌧️','약한 비'], 63:['🌧️','비'], 65:['🌧️','강한 비'],
  66:['🌧️','어는 비'], 67:['🌧️','어는 비'],
  71:['🌨️','약한 눈'], 73:['🌨️','눈'], 75:['❄️','많은 눈'], 77:['🌨️','싸락눈'],
  80:['🌦️','소나기'], 81:['🌧️','소나기'], 82:['⛈️','강한 소나기'],
  85:['🌨️','눈 소나기'], 86:['❄️','강한 눈 소나기'],
  95:['⛈️','뇌우'], 96:['⛈️','뇌우·우박'], 99:['⛈️','강한 뇌우']
};
const NIGHT = { 0:'🌙', 1:'🌙', 2:'☁️' };

let coords = null;
try { coords = JSON.parse(localStorage.getItem('clock_coords')); } catch (e) {}

/* 앱(APK)에서는 위치와 인터넷 요청을 안드로이드 쪽에서 처리 (WebView보다 안정적) */
const nativePending = {};
let nativeSeq = 0;
window.__nativeFetchDone = (id, ok, text) => {
  const p = nativePending[id];
  if (!p) return;
  delete nativePending[id];
  ok ? p.res(text) : p.rej(new Error(text));
};
function getJSON(url) {
  if (window.Android && Android.fetchText) {
    return new Promise((res, rej) => {
      const id = ++nativeSeq;
      nativePending[id] = { res, rej };
      Android.fetchText(id, url);
      setTimeout(() => { if (nativePending[id]) { delete nativePending[id]; rej(new Error('응답 시간 초과')); } }, 20000);
    }).then(JSON.parse);
  }
  return fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

function saveCoords(c) {
  coords = c;
  try { localStorage.setItem('clock_coords', JSON.stringify(c)); } catch (e) {}
}

function getPosition() {
  return new Promise(resolve => {
    if (window.Android && Android.getLocation) {
      const s = Android.getLocation();
      if (s) saveCoords(JSON.parse(s));
      return resolve(coords);
    }
    if (!navigator.geolocation) return resolve(coords);
    navigator.geolocation.getCurrentPosition(
      p => { saveCoords({ lat: p.coords.latitude, lon: p.coords.longitude }); resolve(coords); },
      () => resolve(coords),           // 실패 시 마지막으로 저장된 위치 사용
      { timeout: 15000, maximumAge: 30 * 60 * 1000 }
    );
  });
}

async function loadPlaceName(c) {
  try {
    const j = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${c.lat}&longitude=${c.lon}&localityLanguage=ko`);
    const parts = [j.principalSubdivision, j.city, j.locality].filter(Boolean);
    const name = [...new Set(parts)].join(' ');
    if (name) $('loc').textContent = name;
  } catch (e) {}
}

async function loadWeather() {
  let c = await getPosition();
  if (!c) {
    c = { lat: 37.5665, lon: 126.9780 }; // 위치 권한이 없으면 서울 기준
    $('loc').textContent = '서울 (위치 권한 없음)';
  } else {
    if ($('loc').textContent.includes('확인')) $('loc').textContent = '현재 위치';
    loadPlaceName(c);
  }

  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}`
      + `&hourly=temperature_2m,weather_code,precipitation_probability,is_day`
      + `&timezone=auto&forecast_days=2`;
    const j = await getJSON(url);
    const h = j.hourly;

    const now = new Date();
    const key = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:00`;
    let i = h.time.indexOf(key);
    if (i < 0) i = 0;

    let html = '';
    for (let k = 0; k < 5; k++) {
      const idx = i + k;
      if (idx >= h.time.length) break;
      const hour = parseInt(h.time[idx].slice(11, 13), 10);
      const code = h.weather_code[idx];
      const [icon0, desc] = WMO[code] || ['❔', '-'];
      const icon = (!h.is_day[idx] && NIGHT[code]) ? NIGHT[code] : icon0;
      const label = k === 0 ? '지금' : `${pad(hour)}시`;
      html += `<div class="cell${k === 0 ? ' now' : ''}" title="${desc}">
        <span class="h">${label}</span>
        <span class="ic">${icon}</span>
        <span class="t">${Math.round(h.temperature_2m[idx])}°</span>
        <span class="p">${h.precipitation_probability[idx] ?? 0}%</span>
      </div>`;
    }
    $('rows').innerHTML = html;
  } catch (e) {
    const msg = document.createElement('div');
    msg.className = 'msg';
    msg.textContent = `날씨를 불러오지 못했어요 (${e.message || e}). 잠시 후 다시 시도합니다.`;
    $('rows').replaceChildren(msg);
    clearTimeout(window.__retry);
    window.__retry = setTimeout(loadWeather, 60 * 1000);
  }
}

loadWeather();
// 매 정시 직후 + 30분마다 갱신
setInterval(() => {
  const m = new Date().getMinutes();
  if (m === 1 || m === 31) loadWeather();
}, 60 * 1000);

/* ---------- 화면 꺼짐 방지 ---------- */
let lock = null;
async function keepAwake() {
  try { lock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
keepAwake();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { keepAwake(); loadWeather(); }
});
$('clock').addEventListener('click', keepAwake);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- 설정 저장 ---------- */
const PREF_KEY = 'clock_prefs';
let prefs = { night: true, nightFrom: 22, nightTo: 7, bg: '#000000', mediaHide: 60 };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY)) || {}); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} };

/* ---------- 야간 모드 ---------- */
let wasNight = null;
function applyNight() {
  const h = new Date().getHours();
  const { nightFrom: f, nightTo: t } = prefs;
  const inRange = f === t ? false : (f < t ? (h >= f && h < t) : (h >= f || h < t));
  const night = prefs.night && inRange;
  if (night === wasNight) return;
  wasNight = night;
  document.body.classList.toggle('night', night);
  if (window.Android) Android.setBrightness(night ? 0.02 : -1);
}
applyNight();
setInterval(applyNight, 30 * 1000);

/* ---------- 배경 색상 ---------- */
const BG_COLORS = ['#000000', '#101418', '#0b1a2e', '#0f2018', '#2a1016', '#1e1530', '#2b2118', '#ffffff'];
/* 배경 밝기(0~1) — 밝으면 글씨를 검정 계열로 */
function luminance(hex) {
  const n = parseInt(hex.slice(1), 16);
  const ch = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * ch(n >> 16 & 255) + 0.7152 * ch(n >> 8 & 255) + 0.0722 * ch(n & 255);
}
function applyBg() {
  document.documentElement.style.setProperty('--bg', prefs.bg);
  document.body.classList.toggle('light', luminance(prefs.bg) > 0.4);
  if (window.Android && Android.setBg) Android.setBg(prefs.bg);
}
applyBg();
function renderSwatches() {
  const box = $('swatches');
  box.replaceChildren();
  BG_COLORS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'sw' + (prefs.bg === c ? ' sel' : '');
    b.style.background = c;
    b.setAttribute('aria-label', '배경 ' + c);
    b.onclick = () => { prefs.bg = c; savePrefs(); applyBg(); renderSwatches(); };
    box.appendChild(b);
  });
  const custom = document.createElement('label');
  custom.className = 'sw sw-custom' + (BG_COLORS.includes(prefs.bg) ? '' : ' sel');
  custom.setAttribute('aria-label', '직접 고르기');
  const input = document.createElement('input');
  input.type = 'color'; input.value = prefs.bg;
  input.oninput = e => { prefs.bg = e.target.value; savePrefs(); applyBg(); };
  input.onchange = () => renderSwatches();
  custom.appendChild(input);
  box.appendChild(custom);
}

/* ---------- 앱(APK) 연동: 배터리, 알림 아이콘, 미디어 ---------- */
const IS_APP = !!window.Android;
$('batt').hidden = !IS_APP;
document.querySelectorAll('.app-only').forEach(el => el.hidden = !IS_APP);

window.nativeBattery = (level, charging) => {
  $('battPct').textContent = (charging ? '⚡' : '') + level + '%';
  $('battFill').style.width = level + '%';
  $('batt').classList.toggle('charging', charging);
  $('batt').classList.toggle('low', !charging && level <= 15);
};
let lastIcons = [];
function renderNotifs() {
  const box = $('notifs');
  box.replaceChildren();
  if (!IS_APP) return;
  if (!Android.hasNotifAccess()) {
    const b = document.createElement('button');
    b.className = 'nhint';
    b.textContent = '알림 아이콘 켜기';
    b.onclick = () => Android.openNotifAccess();
    box.appendChild(b);
    return;
  }
  lastIcons.slice(0, 8).forEach(src => {
    const img = document.createElement('img');
    img.src = src; img.alt = '';
    box.appendChild(img);
  });
}
window.nativeNotifs = icons => { lastIcons = icons || []; renderNotifs(); };
renderNotifs();

const PLAY = 'M7 4v16l13-8z', PAUSE = 'M6 4h4v16H6zM14 4h4v16h-4z';
/* 재생이 멈추면 설정한 시간(prefs.mediaHide초) 뒤에 카드를 숨김 */
let lastMedia = null, pausedSince = null, hideTimer = null;
function updateMediaVisibility() {
  clearTimeout(hideTimer);
  if (!lastMedia || !lastMedia.title) { $('media').hidden = true; return; }
  if (lastMedia.playing) { $('media').hidden = false; return; }
  const left = prefs.mediaHide * 1000 - (Date.now() - pausedSince);
  $('media').hidden = left <= 0;
  if (left > 0) hideTimer = setTimeout(updateMediaVisibility, left);
}
window.nativeMedia = m => {
  lastMedia = m;
  if (!m || m.playing) pausedSince = null;
  else if (pausedSince === null) pausedSince = Date.now();
  updateMediaVisibility();
  if (!m || !m.title) return;
  $('mTitle').textContent = m.title;
  $('mArtist').textContent = [m.artist, m.app].filter(Boolean).join(' · ');
  if (m.art !== undefined && $('mArt').getAttribute('src') !== m.art) $('mArt').setAttribute('src', m.art || '');
  $('mPlayPath').setAttribute('d', m.playing ? PAUSE : PLAY);
};
$('mPrev').onclick = () => Android.mediaAction('prev');
$('mPlay').onclick = () => Android.mediaAction('toggle');
$('mNext').onclick = () => Android.mediaAction('next');

/* ---------- 설정 화면 ---------- */
for (let h = 0; h < 24; h++) {
  $('nightFrom').add(new Option(`${pad(h)}시`, h));
  $('nightTo').add(new Option(`${pad(h)}시`, h));
}
function openPanel() { renderPanel(); $('panel').hidden = false; }
$('gearBtn').onclick = openPanel;
function renderPanel() {
  renderSwatches();
  $('nightBtn').textContent = prefs.night ? '켜짐' : '꺼짐';
  $('nightBtn').classList.toggle('on', prefs.night);
  $('nightFrom').value = prefs.nightFrom;
  $('nightTo').value = prefs.nightTo;
  $('mediaHide').value = prefs.mediaHide;
  if (IS_APP) {
    const n = Android.hasNotifAccess();
    $('notifBtn').textContent = n ? '허용됨' : '허용하기';
    $('notifBtn').classList.toggle('on', n);
    const a = Android.getAutoLaunch() && n && Android.canOverlay();
    $('autoBtn').textContent = a ? '켜짐' : '꺼짐';
    $('autoBtn').classList.toggle('on', a);
  }
}
$('nightBtn').onclick = () => { prefs.night = !prefs.night; savePrefs(); wasNight = null; applyNight(); renderPanel(); };
$('nightFrom').onchange = e => { prefs.nightFrom = +e.target.value; savePrefs(); wasNight = null; applyNight(); };
$('nightTo').onchange = e => { prefs.nightTo = +e.target.value; savePrefs(); wasNight = null; applyNight(); };
$('mediaHide').onchange = e => { prefs.mediaHide = +e.target.value; savePrefs(); updateMediaVisibility(); };
$('notifBtn').onclick = () => { if (!Android.hasNotifAccess()) Android.openNotifAccess(); };
$('autoBtn').onclick = () => {
  if (!Android.hasNotifAccess()) { Android.setAutoLaunch(true); Android.openNotifAccess(); return; }
  if (!Android.canOverlay()) { Android.setAutoLaunch(true); Android.openOverlay(); return; }
  Android.setAutoLaunch(!Android.getAutoLaunch());
  renderPanel();
};
$('closeBtn').onclick = () => { $('panel').hidden = true; };

let pressTimer = null;
$('clock').addEventListener('pointerdown', () => {
  pressTimer = setTimeout(openPanel, 600);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
  $('clock').addEventListener(ev, () => clearTimeout(pressTimer)));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  renderNotifs();
  if (!$('panel').hidden) renderPanel();
});
</script>
</body>
</html>
